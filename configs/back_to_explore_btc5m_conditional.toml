# BackToExplore BTC 5m conditional-risk profile.
#
# This keeps the base smoke behaviour intact, then enables high-range/chop
# sizing: reduce new risk in stressed markets while preserving more size for
# clips that rebalance the current YES/NO inventory.
[strategy]
name = "back_to_explore"

[back_to_explore]
# Clip/risk sizing
base_clip_usdc = 7.24
max_clip_usdc = 200.0

# Pair economics and participation behavior
min_pair_cost_for_two_sided = 0.96
pair_clip_multiplier = 0.95
directional_strength_mult = 1.6
residual_taper_start_frac = 0.55
residual_min_clip_multiplier = 0.35
max_residual_shares = 120.0
min_clip_multiplier_to_emit = 0.18

# Conditional high-range/chop sizing.
range_soft_throttle = 0.65
range_hard_throttle = 0.95
range_min_clip_multiplier = 0.20
range_pair_min_clip_multiplier = 0.70
range_chop_min_range = 0.20
range_clean_path_efficiency = 0.78
range_chop_sign_flip_rate = 0.35
range_reversal_pressure = 0.45

# Execution shape and timing
refresh_secs = 2.8
stop_secs_before_close = 4.0
min_entry_price = 0.02
max_entry_price = 0.99
sweep_depth = 6
high_activity_hours = [14, 15, 16, 17, 18, 19]

# Participation and house-bias controls
base_participation_rate = 0.90
two_sided_preference = 3.5
target_risk_per_clip_frac = 0.0025
base_target_net_shares = 6.0
good_hour_target_net_mult = 3.0

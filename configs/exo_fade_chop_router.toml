# Exo fade with chop/day decision router: EXPERIMENT NOTES ONLY.
#
# WARNING (2026-07-02 review): pm-app walk-forward --profile does NOT parse
# [strategy.exo_fade] sections (StrategyProfileFile supports bonereaper_v2 /
# back_to_explore only). Passing this file to walk-forward runs the ungated
# champion config while printing a warning, which invalidates any gate
# experiment. To actually run these gates, use the alpha harness CLI flags:
#   pm-app alpha ... --skip-calm --skip-expanded-mixed
# or the shadow CLI equivalents. This file is retained as a parameter record
# until exo_fade profile parsing exists.

[profile]
name = "exo_fade_chop_router"

[strategy.exo_fade]
bankroll_usdc = 1000.0
clip_usdc = 25.0
edge_threshold = 0.14
min_marginal_edge = 0.06
max_clips = 2
rearm_edge = 0.08
exit_after_s = 0
stop_before_close_s = 90
vol_lookback_s = 3600
perp_price_weight = 0.75
latency_ms = 150
entry_mode = "fade"

min_entry_ask = 0.45
max_entry_ask = 0.85
max_p_side = 0.92
skip_open_fav_gap = true
open_fav_p_min = 0.88
open_fav_ask_max = 0.62
open_fav_secs = 300
skip_spot_misalign_s = 60

# === CHOP / REGIME ROUTER (decision-time, SSOT in pm_alpha::decide) ===
# EXPERIMENTAL RESEARCH PROFILE. NOT PROD. The Jun 14-19 live sweep that
# picked skip_calm + skip_expanded_mixed was overfit: out-of-sample Jun 20-30
# these gates blocked 99% of entries (10 in 10 days). Kept here only for
# harness experiments; prod runs ungated (shadow_final_gated_flags.sh).
skip_calm = true
skip_expanded_mixed = true
skip_expanded_high_flip = false
only_calm = false
# Clean-directional tilt (crates/pm-alpha/src/directional.rs) is UNVALIDATED;
# active only when > 0. Set >0 for tilt experiments, never in prod.
directional_tilt_strength = 0.0

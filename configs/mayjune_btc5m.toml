# May/June 2026 regime strategy — separate from Feb–Apr tuned exo_fade.
#
# Hypothesis: post-May BTC 5m windows are path-dominated; raw BSM saturation
# (p_side→1, touch~0.50) is the live failure mode. This profile is tuned ONLY
# on May/June tape — never validated against pre-May holdouts for promotion.
#
# Walk-forward ($1K portfolio):
#   pm-app walk-forward \
#     --markets data/manifests/canonical/btc-updown-5m_up.jsonl \
#     --local-cache-dir data/cache \
#     --strategies mayjune_fade \
#     --date-start 2026-05-07 --date-end 2026-06-17 \
#     --starting-cash 1000 --portfolio-mode \
#     --clip-fraction-of-equity 0.025 --max-clip-usdc 50 \
#     --use-outcome-label --spot-symbol BTCUSDT
#
# Alpha harness + May-only calibrator (see scripts/mayjune_strategy_calibrate.sh):
#   ./scripts/mayjune_strategy_calibrate.sh

[strategy]
name = "mayjune_fade"

[strategy.mayjune_fade]
bankroll_usdc = 1000.0
clip_usdc = 50.0
edge_threshold = 0.14
min_marginal_edge = 0.06
max_clips = 2
rearm_edge = 0.08
exit_after_s = 0
stop_before_close_s = 90
vol_lookback_s = 3600
perp_price_weight = 0.75
latency_ms = 250
entry_mode = "fade"
min_entry_ask = 0.45
max_entry_ask = 0.85
max_p_side = 0.92
skip_open_fav_gap = true
open_fav_p_min = 0.88
open_fav_ask_max = 0.62
open_fav_secs = 300
skip_spot_misalign_s = 60
skip_expanded_high_flip = false
skip_expanded_mixed = false
skip_calm = false
directional_tilt_strength = 0.0

# Regime gates OFF (2026-07-01): the Jun 14-19 live sweep that selected
# skip-calm + skip-expanded-mixed was overfit; out-of-sample Jun 20-30 those
# gates blocked 99% of entries (10 in 10 days). All-window May research also
# rejected regime gating (calm +$10.1k, mixed +$15.7k of W3 NET). Do not
# re-enable without all-window backtest evidence + 48h paper parity.

[calibration]
# In-script split — train calibrator on pre-split only, never on June val.
train_end = "2026-05-24"
val_may_start = "2026-05-25"
val_jun_end = "2026-06-17"
# Thesis A champion — BTC 5m exogenous fade (A_lead bucket gates).
#
# Implements the core fade lane from docs/research/strategy-hunt/06-thesis-decomposition.md:
#   0.15 <= ask <= 0.85, p_side >= 0.25 (underdog-side stale-book fade).
#
# Run via pm-app alpha (flags mirror [harness] below):
#
#   pm-app alpha \
#     --markets data/manifests/canonical/btc-updown-5m_up.jsonl \
#     --slug-prefix btc-updown-5m- \
#     --local-cache-dir data/cache \
#     --edge-thresholds 0.12 \
#     --min-p-side 0.25 \
#     --min-entry-ask 0.15 \
#     --max-entry-ask 0.85 \
#     (no --kelly-sizing — flat $50 matches shadow parity) \
#     --latency-ms 150 \
#     --vol-lookback-s 3600 \
#     --stop-before-close-s 90 \
#     --notional-usdc 50

[harness]
edge_threshold = 0.12
min_p_side = 0.25
min_entry_ask = 0.15
max_entry_ask = 0.85
kelly_sizing = false
notional_usdc = 50.0
latency_ms = 150
vol_lookback_s = 3600
stop_before_close_s = 90
entry_mode = "fade"